# -------------------------
# Server
# -------------------------
server.port=8080

# -------------------------
# MongoDB
# -------------------------
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB}

# -------------------------
# JWT Configuration
# -------------------------
app.jwt.secret=${JWT_SECRET}

# Token expiration (1 hour = 3600000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION}

# Remember-me expiration (30 days)
app.jwt.remember-expiration-ms=2592000000

# -------------------------
# Cloudinary
# -------------------------
cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${CLOUD_KEY}
cloudinary.api_secret=${CLOUD_SECRET}

# -------------------------
# MAIL CONFIG (GMAIL SMTP)
# -------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# -------------------------
# Logging (Optional but useful on Render)
# -------------------------
logging.level.org.springframework.security=DEBUG
logging.level.com.project.society=DEBUG
